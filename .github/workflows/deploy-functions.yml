# Supabase Edge Function 자동 배포
# main 에 supabase/functions/<이름>/ 아래 파일이 바뀌어 푸시되면, 바뀐 함수만 cn-trainer 에 배포한다.
# Verify JWT 는 항상 끔(앱이 Authorization 헤더를 안 보냄).
# 필요: GitHub 저장소 시크릿 SUPABASE_ACCESS_TOKEN (Supabase 계정 Access Token). 없으면 아무것도 안 하고 통과.
# 수동 실행: Actions 탭 → deploy-functions → Run workflow → 함수 이름 입력
name: deploy-functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
    inputs:
      fn:
        description: "배포할 함수 이름(쉼표 구분, 예: video,call)"
        required: true
        default: "video"

env:
  PROJECT_REF: qmxcfsozzrcdakkiozts
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 확인
        id: tok
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN 시크릿이 없어 배포를 건너뜁니다."; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == '1'
        with:
          fetch-depth: 2
          sparse-checkout: supabase

      - name: 배포할 함수 고르기
        if: steps.tok.outputs.ok == '1'
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FNS=$(echo "${{ github.event.inputs.fn }}" | tr ',' ' ')
          else
            BEFORE="${{ github.event.before }}"
            git fetch --depth=1 origin "$BEFORE" 2>/dev/null || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              FNS=$(git diff --name-only "$BEFORE" HEAD -- supabase/functions | cut -d/ -f3 | sort -u | tr '\n' ' ')
            else
              FNS=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | cut -d/ -f3 | sort -u | tr '\n' ' ')
            fi
          fi
          OUT=""
          for f in $FNS; do [ -f "supabase/functions/$f/index.ts" ] && OUT="$OUT $f"; done
          echo "배포 대상:$OUT"
          echo "fns=$OUT" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.tok.outputs.ok == '1' && steps.pick.outputs.fns != ''
        with:
          version: latest

      - name: 배포
        if: steps.tok.outputs.ok == '1' && steps.pick.outputs.fns != ''
        run: |
          for f in ${{ steps.pick.outputs.fns }}; do
            echo "▶ $f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
